<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo Data Scraping and Lead Enrichment | ApolloDataScrap</title>
<meta name="description" content="Apollo data scraping, mobile number and email enrichment, company data and LinkedIn Sales Navigator scraping, delivered as a clean Google Sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --white:#FFFFFF; --ink:#0E1A2F; --muted:#56627A;
  --line:#D9DFEA; --line-soft:#E8ECF4;
  --blue:#2750F0; --blue-deep:#1D3FC7; --blue-soft:#E7ECFE;
  --mint:#0F7A55; --mint-soft:#DCF3E8; --amber:#8A5A00; --amber-soft:#FFF0CC;
  --hl:#FFE27A; --orange:#F0612B;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --wrap:1160px;
}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.1}
h2{font-size:clamp(1.9rem,3.6vw,2.8rem)}
h3{font-size:1.25rem;line-height:1.25}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}

/* skip link */
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}
.skip:focus{left:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.btn--primary{background:var(--blue);color:#fff}
.btn--primary:hover{background:var(--blue-deep)}
.btn--ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:#fff}
.btn--light{background:#fff;color:var(--blue-deep)}
.btn--light:hover{background:var(--blue-soft)}
.btn--block{width:100%}

/* header */
.site-header{position:sticky;top:0;z-index:50;background:rgba(246,248,252,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header__in{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand__name{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:30px}
.nav a:not(.btn){text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
.nav a:not(.btn):hover{border-bottom-color:var(--line)}
.nav a[aria-current="page"]:not(.btn){border-bottom-color:var(--blue);color:var(--blue-deep)}
.nav .nav__cta{padding:10px 18px}
.menu-btn{display:none;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}

/* hero */
.hero{position:relative;padding:72px 0 88px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent);mask-image:linear-gradient(to bottom,#000 30%,transparent)}
.hero__in{display:grid;grid-template-columns:.9fr 1.2fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.4rem,4.6vw,3.9rem);line-height:1.04;letter-spacing:-.035em}
.hero__lead{margin-top:22px;font-size:1.2rem;color:var(--muted);max-width:34em}
.hero__actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero__note{margin-top:20px;font-size:.95rem;color:var(--muted)}

/* spreadsheet window */
.sheet{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 28px 60px -28px rgba(14,26,47,.38)}
.sheet__bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.namebox{min-width:52px;text-align:center;padding:3px 8px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:.82rem}
.fx{font-style:italic;color:var(--muted);font-size:.9rem}
.formula{font-size:.86rem}
.sheet__scroll{overflow-x:auto}
.sheet__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--paper);border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.tabs{display:flex;gap:2px;padding:0 12px;background:#EEF1F7;border-top:1px solid var(--line);overflow-x:auto}
.tab{flex:none;padding:11px 18px;background:transparent;border:0;border-top:2px solid transparent;font-size:.9rem;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:#fff;color:var(--blue-deep);font-weight:600;border-top-color:var(--blue)}

.xl{width:100%;border-collapse:collapse;font-size:.86rem}
.xl th,.xl td{padding:9px 14px;text-align:left;white-space:nowrap;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.xl thead th{background:#EEF2FA;font-weight:600}
.xl .letters th{background:var(--paper);color:var(--muted);font-weight:500;font-size:.74rem;text-align:center;padding:5px 14px}
.xl .gut{background:var(--paper);color:var(--muted);text-align:center;width:44px;padding-left:8px;padding-right:8px;font-size:.78rem}
.xl--live th,.xl--live td{padding:9px 10px}
.xl--live .gut{padding-left:6px;padding-right:6px;width:36px}
.xl--live tbody tr{animation:rowIn .5s both;animation-delay:calc(var(--i) * .28s + .3s)}
.xl--live tbody tr.is-new td{animation:flash 2.6s 2s both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--hl)}100%{background:transparent}}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.chip--ok{background:var(--mint-soft);color:var(--mint)}
.chip--warn{background:var(--amber-soft);color:var(--amber)}

/* sections */
.section{padding:96px 0}
.section--white{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.section--dark{background:var(--ink);color:#fff}
.section__head{max-width:660px;margin:0 auto 48px;text-align:center}
.section__head p{margin-top:14px;color:var(--muted);font-size:1.1rem}
.section__head--row{max-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.section__head--row > div{max-width:660px}
.split{display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:start}
.split__head{position:sticky;top:100px}
.split__head p{margin-top:14px;color:var(--muted);font-size:1.1rem}
.section--dark .split__head p{color:#B8C3DA}

/* service cells */
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cell{position:relative;display:flex;flex-direction:column;gap:12px;min-height:290px;padding:30px 28px 26px;background:var(--white);text-decoration:none}
.cell:hover,.cell:focus-visible{background:var(--blue-soft);outline:2px solid var(--blue);outline-offset:-2px;z-index:1}
.cell::after{content:"";position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:var(--blue);border:2px solid #fff;opacity:0}
.cell:hover::after,.cell:focus-visible::after{opacity:1}
.cell p{color:var(--muted);font-size:.98rem}
.cell__foot{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
.cell__price{font-weight:700}
.cell__more{font-size:.92rem;font-weight:600;color:var(--blue-deep);text-decoration:underline;text-underline-offset:4px}
.ico{display:grid;place-items:center;width:46px;height:46px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.cell:hover .ico,.cell:focus-visible .ico{background:#fff}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* why */
.rows li{display:grid;grid-template-columns:36px 1fr;gap:18px;padding:26px 0;border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.rows .tick{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mint-soft);color:var(--mint)}
.rows .tick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rows h3{margin-bottom:6px}
.rows p{color:var(--muted)}
.why6__head{text-align:center;max-width:780px;margin:0 auto 56px}
.why6__head h2 .accent{color:var(--orange)}
.why6__head p{margin-top:14px;color:var(--muted);font-size:1.12rem}
.why6__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:960px){.why6__grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.why6__grid{grid-template-columns:1fr}}

/* steps */
.steps li{position:relative;padding:0 0 34px 68px}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:48px;bottom:8px;width:2px;background:rgba(255,255,255,.2)}
.steps__n{position:absolute;left:0;top:0;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--blue);font-family:var(--display);font-weight:700}
.steps h3{margin-bottom:6px}
.steps p{color:#B8C3DA}

/* quotes */
.quotes{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.quote{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:32px;background:var(--white);border:1px solid var(--line);border-radius:10px}
.quote--lead{grid-row:span 2;padding:44px;background:var(--blue);border-color:var(--blue);color:#fff}
.quote blockquote{font-size:1.08rem}
.quote--lead blockquote{font-family:var(--display);font-size:clamp(1.4rem,2.4vw,1.9rem);line-height:1.3;letter-spacing:-.01em}
.quote figcaption{display:flex;align-items:center;gap:12px;font-size:.92rem}
.quote figcaption strong{display:block}
.quote figcaption span{color:var(--muted)}
.quote--lead figcaption span{color:#CBD6FF}
.avatar{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;background:var(--blue-soft);color:var(--blue-deep);font-weight:700}
.quote--lead .avatar{background:#fff}

/* faq */
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-weight:600;font-size:1.05rem;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue-deep);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"\2212";background:var(--blue);color:#fff}
.faq details p{padding:0 48px 24px 0;color:var(--muted);max-width:62ch}

/* page head */
.page-head{padding:72px 0 48px}
.page-head h1{font-size:clamp(2.2rem,4.6vw,3.6rem);letter-spacing:-.03em;max-width:18em}
.page-head p{margin-top:16px;max-width:40em;color:var(--muted);font-size:1.15rem}
.crumbs{display:flex;gap:8px;margin-bottom:18px;font-size:.92rem;color:var(--muted)}
.crumbs a{color:var(--blue-deep)}

/* services list */
.svc{display:grid;grid-template-columns:46px 1fr auto;gap:24px;align-items:center;padding:28px 0;border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc p{color:var(--muted);margin-top:4px;max-width:52ch}
.svc__side{display:flex;align-items:center;gap:22px}
.svc__price{text-align:right;font-weight:700;white-space:nowrap}
.svc__price small{display:block;font-weight:400;color:var(--muted)}

/* service detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start;padding-bottom:96px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.shot{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shot--wide{grid-column:1 / -1}
.shot figcaption{padding:10px 14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.prose{margin-top:40px}
.prose h2{font-size:1.6rem;margin-bottom:14px}
.prose p{color:var(--muted);margin-bottom:14px;max-width:62ch}
.checks{margin-top:8px}
.checks li{display:flex;gap:12px;padding:8px 0}
.checks .tick{display:grid;place-items:center;flex:none;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--mint-soft);color:var(--mint)}
.checks .tick svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pricebox{position:sticky;top:92px;padding:28px;background:var(--white);border:1px solid var(--line);border-radius:12px}
.pricebox__label{color:var(--muted);font-size:.92rem}
.price{font-family:var(--display);font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.price small{display:block;margin-top:2px;font-family:var(--body);font-size:.98rem;font-weight:500;letter-spacing:0;color:var(--muted)}
.pricebox dl{margin:20px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pricebox dl div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:.95rem}
.pricebox dt{color:var(--muted)}
.pricebox dd{margin:0;font-weight:600;text-align:right}
.pricebox .btn + .btn{margin-top:10px}
.pricebox__note{margin-top:14px;font-size:.85rem;color:var(--muted)}
.detail-faq{padding:80px 0 96px}
.others{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.others a{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;text-decoration:none;font-size:.92rem}
.others a:hover{border-color:var(--blue);color:var(--blue-deep)}

/* about / contact */
.principles li{padding:26px 0;border-top:1px solid var(--line)}
.principles li:last-child{border-bottom:1px solid var(--line)}
.principles p{color:var(--muted);margin-top:6px}
.lead-p{font-size:1.2rem;color:var(--muted);max-width:40em}
.lead-p + .lead-p{margin-top:16px}
.contact{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:start;padding-bottom:96px}
.contact dl div{padding:16px 0;border-top:1px solid var(--line)}
.contact dl div:last-child{border-bottom:1px solid var(--line)}
.contact dt{font-size:.9rem;color:var(--muted)}
.contact dd{margin:2px 0 0;font-weight:600;word-break:break-word}
.form{padding:32px;background:var(--white);border:1px solid var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label{font-weight:600;font-size:.95rem}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:8px}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--blue-soft);border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:.95rem}
.note:empty{display:none}
.note--ok{background:var(--mint-soft);color:var(--mint)}
.note--err{background:var(--amber-soft);color:var(--amber)}

/* footer */
.cta-band{background:var(--blue);color:#fff}
.cta-band__in{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-top:48px;padding-bottom:48px}
.cta-band h2{font-size:clamp(1.6rem,3vw,2.3rem);max-width:18em}
.site-footer{background:var(--ink);color:#C9D2E6}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1.3fr 1.3fr;gap:40px;padding-top:64px;padding-bottom:48px}
.foot-grid h4{margin-bottom:14px;color:#fff;font-size:1rem}
.foot-grid li + li{margin-top:8px}
.foot-grid a{text-decoration:none;color:#C9D2E6}
.foot-grid a:hover{color:#fff;text-decoration:underline}
.foot-grid .brand__name{color:#fff}
.foot-grid p{margin-top:14px;max-width:30em;font-size:.95rem}
.foot-base{padding-top:20px;padding-bottom:28px;border-top:1px solid rgba(255,255,255,.14);font-size:.88rem;color:#8E9BB8}

/* responsive */
@media (max-width:1020px){
  .cells{grid-template-columns:repeat(2,1fr)}
  .detail{grid-template-columns:1fr}
  .pricebox{position:static}
}
@media (max-width:900px){
  .hero__in,.split,.contact,.quotes{grid-template-columns:1fr}
  .hero{padding:48px 0 64px}
  .split{gap:36px}
  .split__head{position:static}
  .quote--lead{grid-row:auto}
  .foot-grid{grid-template-columns:1fr 1fr}
  .menu-btn{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;padding:12px 24px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
  .site-header.open .nav{display:flex}
  .nav a:not(.btn){padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .nav .nav__cta{margin-top:14px}
}
@media (max-width:640px){
  body{font-size:16px}
  .section{padding:64px 0}
  .cells{grid-template-columns:1fr}
  .cell{min-height:0}
  .cell__foot{flex-direction:column;align-items:flex-start;gap:6px}
  .hide-sm{display:none}
  .svc{grid-template-columns:46px 1fr}
  .svc__side{grid-column:1 / -1;justify-content:space-between}
  .gallery{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .form{padding:22px}
  .quote--lead{padding:30px}
  .foot-grid{grid-template-columns:1fr}
  .faq details p{padding-right:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ===== 3-step process section ===== */
.p3{position:relative;overflow:hidden}
.p3::before{content:"";position:absolute;top:-220px;right:-160px;width:560px;height:560px;background:radial-gradient(closest-side,rgba(39,80,240,.38),transparent);pointer-events:none}
.p3 .wrap{position:relative}
.p3__head{text-align:center;max-width:880px;margin:0 auto 56px}
.p3__badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-size:.92rem;color:#C9D6FF;margin-bottom:24px}
.p3__badge svg{width:16px;height:16px;fill:var(--orange);stroke:none}
.p3__head h2{color:#fff;font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.1}
.p3__head h2 .accent{color:var(--orange)}
.p3__head p{margin-top:18px;color:#B8C3DA;font-size:1.12rem}
.p3__grid{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:18px;align-items:stretch}
.p3__card{padding:34px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));box-shadow:0 24px 50px -30px rgba(0,0,0,.7);transition:transform .25s ease,border-color .25s ease}
.p3__card:hover{transform:translateY(-6px);border-color:rgba(124,155,255,.65)}
.p3__ico{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;margin-bottom:26px;background:linear-gradient(145deg,#3A63FF,#1D3FC7);color:#fff;box-shadow:0 14px 26px -12px rgba(39,80,240,.9)}
.p3__ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.p3__card h3{color:#fff;font-size:1.35rem}
.p3__bar{display:block;width:44px;height:3px;border-radius:3px;background:var(--orange);margin:14px 0 18px}
.p3__card p{color:#B8C3DA}
.p3__arrow{display:grid;place-items:center;color:#7C9BFF}
.p3__arrow svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:960px){.p3__grid{grid-template-columns:1fr}.p3__arrow{transform:rotate(90deg)}}

/* ===== new box design (Why teams choose + sections below) ===== */

function xlTable(cols,rows){
  const letters=cols.map((c,i)=>`<th>${String.fromCharCode(65+i)}</th>`).join('');

  const body=rows.map((r,j)=>`<tr><td class="gut">${j+1}</td>${r.map((v,i)=>`<td>${cols[i]==='Status'?chip(v):v}</td>`).join('')}</tr>`).join('');
  return `<table class="xl"><thead><tr class="letters"><th></th>${letters}</tr><tr><th class="gut"></th>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------- work images (generated SVG) ---------- */
const trunc=(t,n)=>{t=String(t);return t.length>n?t.slice(0,Math.max(1,n-1))+'…':t};
function sheetSvg(s){
  const W=720,gut=36,hdr=100,rh=36,n=Math.min(s.rows.length,7),H=hdr+rh*n+4;
  const lens=s.cols.map((c,i)=>s.cols[i]==='Status'?14:Math.max(c.length+2,...s.rows.map(r=>String(r[i]).length))+3);
  const tot=lens.reduce((a,b)=>a+b,0);
  const ws=lens.map(l=>l/tot*(W-gut));
  const xs=[];ws.reduce((a,w,i)=>{xs[i]=a;return a+w},gut);
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sample output sheet for ${s.title}" font-family="Instrument Sans, Segoe UI, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="40" fill="#F6F8FC"/>`;
  o+=`<rect x="12" y="8" width="54" height="24" rx="4" fill="#fff" stroke="#D9DFEA"/><text x="39" y="24.5" font-size="12" text-anchor="middle" fill="#0E1A2F">A1</text>`;
  o+=`<text x="84" y="25" font-size="13" font-style="italic" fill="#56627A">fx</text><text x="108" y="25" font-size="12.5" fill="#0E1A2F">${s.cols[0]}</text>`;
  o+=`<rect y="40" width="${W}" height="24" fill="#F6F8FC"/>`;
  s.cols.forEach((c,i)=>{o+=`<text x="${xs[i]+ws[i]/2}" y="56" font-size="11" text-anchor="middle" fill="#56627A">${String.fromCharCode(65+i)}</text>`});
  o+=`<rect y="64" width="${W}" height="36" fill="#EEF2FA"/>`;
  s.cols.forEach((c,i)=>{o+=`<text x="${xs[i]+10}" y="87" font-size="12.5" font-weight="700" fill="#0E1A2F">${c}</text>`});
  s.rows.slice(0,n).forEach((r,j)=>{
    const y=hdr+rh*j;
    o+=`<line x1="0" x2="${W}" y1="${y+rh}" y2="${y+rh}" stroke="#E8ECF4"/><text x="${gut/2}" y="${y+23}" font-size="11" text-anchor="middle" fill="#56627A">${j+1}</text>`;
    r.forEach((v,i)=>{
      const x=xs[i]+10;
      if(s.cols[i]==='Status'){
        const ok=(v==='Valid'||v==='Verified'),w=v.length*7+22;
        o+=`<rect x="${x}" y="${y+8}" width="${w}" height="20" rx="10" fill="${ok?'#DCF3E8':'#FFF0CC'}"/><text x="${x+w/2}" y="${y+22}" font-size="11.5" font-weight="700" text-anchor="middle" fill="${ok?'#0F7A55':'#8A5A00'}">${v}</text>`;
      } else {
        o+=`<text x="${x}" y="${y+23}" font-size="12.5" fill="#0E1A2F">${trunc(v,Math.floor((ws[i]-14)/6.4))}</text>`;
      }
    });
  });
  xs.forEach(x=>{o+=`<line x1="${x}" x2="${x}" y1="40" y2="${H}" stroke="#E8ECF4"/>`});
  return o+'</svg>';
}

function baSvg(s){
  const W=720,H=300,b=s.ba;
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What you send and what you get" font-family="Instrument Sans, Segoe UI, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  o+=`<rect x="24" y="22" width="290" height="256" rx="10" fill="#F6F8FC" stroke="#D9DFEA"/><rect x="406" y="22" width="290" height="256" rx="10" fill="#E7ECFE" stroke="#BFCBFA"/>`;
  o+=`<text x="44" y="52" font-size="14" font-weight="700" fill="#0E1A2F">${b.a}</text><text x="426" y="52" font-size="14" font-weight="700" fill="#1D3FC7">${b.b}</text>`;
  b.pairs.forEach(([i,out],k)=>{
    const y=70+k*68;
    o+=`<rect x="40" y="${y}" width="258" height="52" rx="6" fill="#fff" stroke="#D9DFEA"/><text x="54" y="${y+31}" font-size="12.5" fill="#0E1A2F">${trunc(i,38)}</text>`;
    o+=`<rect x="422" y="${y}" width="258" height="52" rx="6" fill="#fff" stroke="#BFCBFA"/><circle cx="444" cy="${y+26}" r="9" fill="#DCF3E8"/><path d="m439.5 ${y+26} 3.2 3.2 6-6.2" fill="none" stroke="#0F7A55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="462" y="${y+31}" font-size="12.5" fill="#0E1A2F">${trunc(out,32)}</text>`;
  });
  o+=`<path d="M330 150h60m-10-10 10 10-10 10" fill="none" stroke="#2750F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  return o+'</svg>';
}

function reportSvg(s){
  const W=720,H=300;
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example delivery report" font-family="Instrument Sans, Segoe UI, sans-serif">`;
  o+=`<rect width="${W}" height="${H}" fill="#fff"/><text x="24" y="42" font-size="16" font-weight="700" fill="#0E1A2F">Delivery report</text><text x="696" y="42" font-size="12" text-anchor="end" fill="#56627A">Example figures</text><line x1="24" x2="696" y1="60" y2="60" stroke="#E8ECF4"/>`;
  s.report.forEach(([l,p,t],k)=>{
    const y=96+k*60;
    o+=`<text x="24" y="${y}" font-size="13" fill="#0E1A2F">${l}</text><text x="696" y="${y}" font-size="13" font-weight="700" text-anchor="end" fill="#0E1A2F">${t}</text>`;
    o+=`<rect x="24" y="${y+10}" width="672" height="12" rx="6" fill="#E8ECF4"/><rect x="24" y="${y+10}" width="${672*p/100}" height="12" rx="6" fill="${k===0?'#2750F0':'#0F7A55'}"/>`;
  });
  o+=`<text x="24" y="282" font-size="12" fill="#56627A">Delivered as Google Sheet and CSV</text>`;
  return o+'</svg>';
}

/* ---------- router ---------- */
function route(){
  const raw=(location.hash||'#/').slice(1)||'/';
  const [path,qs]=raw.split('?');
  const params=new URLSearchParams(qs||'');
  const parts=path.split('/').filter(Boolean);
  let html,title,nav='home';
  if(parts[0]==='services'){html=pageServices();title='Apollo Data Scraping Services';nav='services'}
  else if(parts[0]==='service'&&parts[1]&&bySlug(parts[1])){const s=bySlug(parts[1]);html=pageService(parts[1]);title=s.title;nav='services'}
  else if(parts[0]==='about'){html=pageAbout();title='About';nav='about'}
  else if(parts[0]==='contact'){html=pageContact(params);title='Contact';nav='contact'}
  else {html=pageHome();title='Apollo Data Scraping and Lead Enrichment'}
  const main=document.getElementById('main');
  main.innerHTML=html;
  document.getElementById('footer').innerHTML=footerHtml();
  document.title=title+' | '+CONFIG.brand;
  document.querySelectorAll('[data-nav]').forEach(a=>{a.dataset.nav===nav?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  document.getElementById('siteHeader').classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}

  const name=v('cName'),email=v('cEmail'),service=v('cService'),msg=v('cMsg');
  const note=document.getElementById('formNote');
  if(!name||!email||!msg){note.className='note note--err';note.textContent='Add your name, email and a short message so we can reply.';return}
  if(!/^\S+@\S+\.\S+$/.test(email)){note.className='note note--err';note.textContent='Check your email address. It should look like name@company.com.';return}
  const subject=encodeURIComponent('Request: '+service);
  const body=encodeURIComponent('Name: '+name+'\nEmail: '+email+'\nService: '+service+'\n\n'+msg);
  note.className='note note--ok';
  note.innerHTML='Your email app should open with your request. If it does not, write to <a href="mailto:'+CONFIG.email+'">'+CONFIG.email+'</a>.';
  window.location.href='mailto:'+CONFIG.email+'?subject='+subject+'&body='+body;
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){
    document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',t===tab));
    const s=bySlug(tab.dataset.tab);
    document.getElementById('sampleBody').innerHTML=xlTable(s.cols,s.rows);
    return;
  }
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();const el=document.getElementById(g.dataset.go);if(el)el.scrollIntoView({behavior:'smooth'});return}
  if(e.target.closest('#sendBtn')){sendContact();return}
  const mb=e.target.closest('#menuBtn');
  if(mb){const h=document.getElementById('siteHeader');const open=h.classList.toggle('open');mb.setAttribute('aria-expanded',open);return}
  if(e.target.closest('#skipBtn')){document.getElementById('main').focus();return}
});
window.addEventListener('hashchange',route);
document.getElementById('brandMark').innerHTML=logoSvg();
route();
</script>
</body>
</html>
